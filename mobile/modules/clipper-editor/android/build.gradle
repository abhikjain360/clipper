plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.clipper.editor'
version = '0.1.0'

android {
  namespace 'com.clipper.editor'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  lint {
    abortOnError true
    checkReleaseBuilds true
    fatal 'NewApi'
  }
}
