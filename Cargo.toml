[workspace]
members = [
  "crates/api-types",
  "crates/app-types",
  "crates/core",
  "crates/server",
  "crates/client",
  "crates/cli",
  "crates/daemon",
  "crates/daemon-client",
  "crates/daemon-types",
  "crates/fs-txn",
  "crates/schedule",
  "crates/mobile-uniffi",
  "crates/web-wasm",
  "web/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
# clipper crates
clipper-core = { path = "crates/core" }
clipper-api-types = { path = "crates/api-types" }
clipper-app-types = { path = "crates/app-types" }
clipper-client = { path = "crates/client" }
clipper-daemon-client = { path = "crates/daemon-client" }
clipper-daemon-types = { path = "crates/daemon-types" }
clipper-fs-txn = { path = "crates/fs-txn" }
clipper-schedule = { path = "crates/schedule" }

# shared third-party crates
argon2 = "0.6.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
garde = { version = "0.23.0", features = ["derive"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
hmac = "0.12.1"
iana-time-zone = "0.1.65"
libc = "0.2.190"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand = "0.10.3"
rrule = "0.14.0"
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6.5"
sha2 = "0.10.9"
strum = { version = "0.28.0", features = ["derive"] }
tauri = "2.12.1"
tauri-build = "2.7.1"
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-dialog = "2.8.1"
tempfile = "3"
thiserror = "2.0.21"
tokio = "1.53.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uniffi = "0.31.2"
uuid = "1.27.0"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
wl-clipboard-rs = "0.9.4"
zeroize = { version = "1.9.1", features = ["derive", "serde"] }
