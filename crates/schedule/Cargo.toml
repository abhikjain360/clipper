[package]
name = "clipper-schedule"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
clipper-api-types.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
rrule.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["js", "serde", "v4", "v5"] }

[dev-dependencies]
uuid = { workspace = true, features = ["v4", "v5"] }
serde_json.workspace = true
chrono.workspace = true
chrono-tz.workspace = true

# Parsing lives outside the browser build. A page cannot fetch a third-party
# calendar URL anyway (no provider sends CORS headers), so the wasm client only
# ever displays events another device ingested — and calcard pulls ahash, whose
# getrandom 0.3 needs a wasm backend cfg this workspace does not set.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
calcard = "0.3.13"
