[package]
name = "clipper-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
clipper-api-types.workspace = true
argon2.workspace = true
chacha20poly1305 = "0.10.1"
ed25519-dalek.workspace = true
hkdf = "0.12.4"
opaque-ke = { version = "4.0.1", features = ["argon2", "std"] }
# opaque-ke 4.0.1 re-exports rand 0.8 without enabling its OS RNG feature.
opaque-rand = { package = "rand", version = "0.8.5", features = ["getrandom"] }
postcard.workspace = true
rand.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom.workspace = true

[dev-dependencies]
